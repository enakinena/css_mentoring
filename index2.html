<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles2.css" />
  </head>
  <body>
    <div>display: flex</div>
    <div class="flex-container">
      <div class="flex-element">Lorem ipsum.</div>
      <div class="flex-element">Lorem ipsum.</div>
    </div>
    <!-- по умолчанию размер flex containera такие же как у блочного, т.е занимают всю доступную ширину. А высота равна высоте внутреннего содержимого.
        Если элементу задать inline-flex, то элемент будет вести себя как строчный.
    Его размеры по ширине и высоте будут зависеть от размеров внутреннего содержимого. -->
    <div>display: inline-flex</div>
    <div class="inline-flex-container">
      <div class="flex-element">Lorem ipsum.</div>
      <div class="flex-element">Lorem ipsum.</div>
    </div>
  </body>
</html>
