<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- font Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-organick">
          <img
            src="./image/logo-organick.png"
            class="logo-organick"
            alt="logo-organick"
          />
          <span class="organick-text">Organick</span>
        </div>
        <nav class="navigation">
          <ul class="navigation-list">
            <li class="navigation-item">
              <a href="#" class="navigation-link">Home</a>
            </li>
            <li class="navigation-item">
              <a href="#" class="navigation-link">About</a>
            </li>
            <li class="navigation-item">
              <a href="#" class="navigation-link">Pages</a>
            </li>
            <li class="navigation-item">
              <a href="#" class="navigation-link">Shop</a>
            </li>
            <li class="navigation-item">
              <a href="#" class="navigation-link">Projects</a>
            </li>
            <li class="navigation-item">
              <a href="#" class="navigation-link">News</a>
            </li>
          </ul>
        </nav>
        <div class="header-btn__actions">
          <div class="search">
            <input type="text" class="search-btn_input" />
            <button class="search-btn">
              <img
                src="./image/loop.svg"
                alt="search-loop"
                width="21px"
                height="21px"
              />
            </button>
          </div>
          <div class="basket-wrapper">
            <button class="basket-btn">
              <img
                src="./image/basket_logo.svg"
                alt="basket-logo"
                class="basket-logo_header"
                width="21px"
                height="21px"
              />
            </button>
            <span>Cart (0)</span>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
