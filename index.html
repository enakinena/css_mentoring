<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 6. Шрифты</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

      body {
        font-family: "Inter";
      }
    </style>
  </head>
  <!-- Свойство font-family как и другие параметры шрифта наследуемое. Исключение: input, textarea, select, button -->
  <body>
    <p style="font-weight: 100">Thin 100</p>
    <p style="font-weight: 200">ExtraLight 200</p>
    <p style="font-weight: 300">Light 300</p>
    <p style="font-weight: 400">Regular 400</p>
    <p style="font-weight: 500">Medium 500</p>
    <p style="font-weight: 600">SemiBold 600</p>
    <p style="font-weight: 700">Bold 700</p>
    <p style="font-weight: 800">ExtraBold 800</p>
    <p style="font-weight: 900">Black 900</p>
    <br />
    <br />
    <hr />
    <br />
    <p>Я шрифт Inter</p>
    <p class="custom-font">Я Roboto шрифт</p>
    <p class="custom-font bold">Я Roboto шрифт в bold начертании.</p>
    <br />
    <hr />
    <br />
    <p>Я стандартный шрифт</p>
    <p class="custom-font">Я Roboto шрифт</p>
    <p class="custom-font bold">
      Я Roboto шрифт в bold начертании, залитый через link
    </p>
    <!-- Свойство font-family: задаёт семейство шрифта -->
    <!-- Свойство font-weight: задаёт начертание шрифта (его жирность) -->
    <!-- Свойство font-size: задаёт размер текста -->
    <!-- Размер значения шрифта по умолчанию это 16px -->
    <!-- line-height: задаёт межстрочный интервал -->
  </body>
</html>
