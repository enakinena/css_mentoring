<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 8. CSS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- background-color: задаём элелементу фоновый цвет -->
    <div class="box-1"></div>
    <div class="box-2"></div>
    <div class="box-3"></div>
    <div class="box-4"></div>
    <!-- background-image: задаёт элементу фоновое изображение или градиент. -->
    <div class="box-5"></div>
    <br />
    <hr />
    <br />
    <!-- background-repeat: repeat - повторяет изображения по обеим осеям (х и y) -->
    <!-- repeat-y (повторение изображения по вертикали. repeat-x: по горизонтали) -->
    <div class="box-6"></div>
    <hr />
    <br />
    <br />
    <hr />
    <div class="box-7"></div>
    <div class="box-8"></div>
    <div class="box-9"></div>
    <div class="box-10"></div>
    <hr />
    <!-- background-attachment: scroll (задаёт правило фона при скролле.
      фон жёстко привязан к элементу)-->
    <!-- background-attachment: fixed (фон будет зафиксирован относительно прокрученного элемента при скролле страницы.) -->
  </body>
</html>
