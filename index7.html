<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>justify-content</title>
    <link rel="stylesheet" href="./styles7.css" />
  </head>
  <body>
    <!-- Для выравнивания флекс элементов по основной оси флекс контейнера, используется свойство justify-content -->
    <div>justify-content: flex-start</div>
    <div class="flex-container justify-content-flex-start">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
    <br />

    <div>justify-content: flex-end</div>
    <div class="flex-container justify-content-flex-end">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
    <br />

    <div>justify-content: center</div>
    <div class="flex-container justify-content-center">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
    <br />

    <div>justify-content: space-between</div>
    <div class="flex-container justify-content-space-between">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
    <br />

    <div>justify-content: space-around</div>
    <div class="flex-container justify-content-space-around">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
    <br />

    <div>justify-content: space-evenly</div>
    <div class="flex-container justify-content-space-evenly">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
  </body>
</html>
