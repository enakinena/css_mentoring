<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex-grow</title>
    <link rel="stylesheet" href="./styles5.css" />
  </head>
  <body>
    <!-- flex-grow (свойство применяется к flex-elementam и указывает, может ли элемент
        растягиваться и в каких пропорциях относительно соседних элементов) -->

    <!-- flex-shrink (полная противоположность flex-grow.
        указывает в каких пропорциях элемент будет стараться уменьшаться относительно соседних элементов, если в родительском контейнере не будет хватать места) -->
    <div class="flex-container">
      <div class="flex-element wide">1</div>
      <div class="flex-element shrink">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
  </body>
</html>
