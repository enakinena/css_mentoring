<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS псевдоэлементы. Урок 13</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <p class="with-before">Элемент с псевдоэлементом ::before</p>

    <p class="with-after">Элемент с псевдоэлементом ::after</p>

    <input class="with-red-placeholder" placeholder="Красный placeholder" />

    <!-- <input type="file" /> -->
    <input class="with-file-selector-button" type="file" />

    <p class="with-first-letter">Элемент с псевдоэлементом ::first-letter</p>

    <p class="with-first-line">
      Элемент с псевдоэлементом <br />
      ::first-line
    </p>

    <p class="with-selection">
      Элемент с псевдоэлементом <br />
      ::selection
    </p>
  </body>
</html>
