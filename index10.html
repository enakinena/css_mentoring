<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>align-content</title>
    <link rel="stylesheet" href="./styles10.css" />
  </head>
  <body>
    <!-- align-content (с помощью него можно распределить свободное пространство между рядами флекс элементов по поперечной оси.
        Значение по умолчанию stretch.) -->
    <div>align-content: stretch</div>
    <div class="flex-container">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
    <br />

    <div>align-content: flex-start</div>
    <div class="flex-container align-content-flex-start">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
    <br />

    <div>align-content: flex-end</div>
    <div class="flex-container align-content-flex-end">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
    <br />

    <div>align-content: center</div>
    <div class="flex-container align-content-center">
      <div class="flex-element">1</div>
      <div class="flex-element">2</div>
      <div class="flex-element">3</div>
      <div class="flex-element">4</div>
    </div>
  </body>
</html>
